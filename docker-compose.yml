# Local development stack:  docker compose up --build
# API docs: http://localhost:8000/docs   MinIO: http://localhost:9001   Mailpit: http://localhost:8025
name: lendwise

x-app: &app
  build:
    context: .
    target: runtime
  env_file: .env
  environment:
    APP_ENV: development
  volumes:
    - ./app:/srv/app/app
    - ./config:/srv/app/config
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started

services:
  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat --loglevel=INFO

  mongo:
    image: mongo:7.0
    # Single-node replica set: required for multi-document transactions and change streams
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    # S3-compatible object storage for KYC documents (use AWS S3 in production)
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lendwise}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lendwise-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    # Catches all outgoing e-mail in development
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mongo_data:
  redis_data:
  minio_data:
