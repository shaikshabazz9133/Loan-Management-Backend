# LendWise backend + MongoDB, for every developer, with one command:
#
#   cp .env.example .env      (first time only)
#   docker compose up -d      (start)        -> API docs: http://localhost:8000/docs
#   docker compose down       (stop, keeps the data)
#
# The MongoDB image is pulled from Docker Hub automatically the first time - no Atlas account needed.
name: lendwise

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017" # MongoDB Compass / local tools: mongodb://localhost:27017
    volumes:
      - mongo_data:/data/db # data survives restarts; `docker compose down -v` deletes it
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker, "mongo" is the database container's name. This overrides MONGODB_URI from .env,
      # so a teammate's Atlas URL in .env doesn't matter when running with Docker.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-lendwise}
    # 1) create the manager account if it doesn't exist yet (safe to repeat), 2) start the API.
    # --reload restarts the server when you edit files in ./app (mounted below).
    command: sh -c "python -m scripts.create_manager; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/srv/app/app
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
