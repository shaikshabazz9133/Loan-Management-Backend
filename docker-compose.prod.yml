# Production stack (single host / VM). MongoDB -> MongoDB Atlas (managed replica set), files -> AWS S3.
#   docker compose -f docker-compose.prod.yml up -d
# For Kubernetes, the same images are used; see docs/ARCHITECTURE.md section "Deployment".
name: lendwise-prod

x-app: &app
  image: ${REGISTRY:-ghcr.io/your-org}/lendwise-api:${IMAGE_TAG:-latest}
  env_file: .env.production
  environment:
    APP_ENV: production
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  api:
    <<: *app
    command: >
      gunicorn app.main:app -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --workers 4 --timeout 60 --graceful-timeout 30 --access-logfile -
    expose:
      - "8000"
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1g }

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=4
    deploy:
      replicas: 2

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat --loglevel=INFO

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  redis_data:
