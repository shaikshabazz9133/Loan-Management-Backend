# LendWise Loan Management - Backend API Catalog (single source of truth)
# Base URL: /api/v1   |   Auth: Bearer JWT unless role is "Public"
# reusable: true  -> one endpoint serves several roles/portals (role-scoped by RBAC)

project: LendWise Loan Management System
version: v1
base_path: /api/v1

team:
  Soughat: Platform lead - core framework, Docker/YAML, CI/CD, auth, config, audit
  Shahid: Customer journey - applications, documents, KYC & bank, notifications
  Manar: Agent domain - agent management, geo matching, accept/decline, verification
  Shabazz: Manager domain - customers, approvals, disbursement, dashboards & reports

modules:
  - id: M1
    name: Authentication
    package: auth
    owner: Soughat
    summary: Sign-up, login (email or mobile), JWT access/refresh rotation, OTP, password reset.
    apis:
      - {method: POST, path: "/auth/register", roles: "Public", reusable: false, desc: "Customer sign-up (name, email, mobile, password, terms)"}
      - {method: POST, path: "/auth/login", roles: "Public", reusable: true, desc: "Login with email or mobile; returns tokens + role for redirect"}
      - {method: POST, path: "/auth/refresh", roles: "Public", reusable: true, desc: "Rotate access/refresh tokens (refresh-token reuse detection)"}
      - {method: POST, path: "/auth/logout", roles: "Any", reusable: true, desc: "Revoke current refresh token / session"}
      - {method: POST, path: "/auth/otp/send", roles: "Public", reusable: true, desc: "Send OTP to mobile (sign-up verification, reset)"}
      - {method: POST, path: "/auth/otp/verify", roles: "Public", reusable: true, desc: "Verify OTP and return a short-lived verification token"}
      - {method: POST, path: "/auth/forgot-password", roles: "Public", reusable: true, desc: "Start password reset (same response whether or not user exists)"}
      - {method: POST, path: "/auth/reset-password", roles: "Public", reusable: true, desc: "Set new password using reset token"}
      - {method: POST, path: "/auth/change-password", roles: "Any", reusable: true, desc: "Change password when logged in"}

  - id: M2
    name: Users & Profile
    package: users
    owner: Soughat
    summary: Shared user accounts (customer, agent, manager) and the signed-in user's own profile.
    apis:
      - {method: GET, path: "/auth/me", roles: "Any", reusable: true, desc: "Current user, role and permissions"}
      - {method: PATCH, path: "/auth/me", roles: "Any", reusable: true, desc: "Update own profile (mobile change needs OTP)"}

  - id: M3
    name: Customer Management
    package: customers
    owner: Shabazz
    summary: Manager views of customers, their application history, block/unblock.
    apis:
      - {method: GET, path: "/customers", roles: "Manager", reusable: false, desc: "Search / filter / paginate customers"}
      - {method: GET, path: "/customers/{id}", roles: "Manager", reusable: false, desc: "Customer profile and stats"}
      - {method: GET, path: "/customers/{id}/applications", roles: "Manager", reusable: false, desc: "Customer application history"}
      - {method: PATCH, path: "/customers/{id}/status", roles: "Manager", reusable: false, desc: "Block / unblock customer"}

  - id: M4
    name: Loan Applications
    package: loans
    owner: Shahid
    summary: Submit, list and track applications; role-aware responses; timeline, history and the status state machine.
    apis:
      - {method: POST, path: "/applications", roles: "Customer", reusable: false, desc: "Submit application (KYC, loan, tenure, address, GPS, bank, document ids); Idempotency-Key"}
      - {method: GET, path: "/applications", roles: "Customer, Agent, Manager", reusable: true, desc: "Role-scoped list with filters, search and pagination"}
      - {method: GET, path: "/applications/{id}", roles: "Customer, Agent, Manager", reusable: true, desc: "Role-aware detail (agent sees amount/address/location only before accepting)"}
      - {method: GET, path: "/applications/{id}/timeline", roles: "Customer, Agent, Manager", reusable: true, desc: "6-step progress (submitted -> disbursed)"}
      - {method: GET, path: "/applications/{id}/history", roles: "Customer, Agent, Manager", reusable: true, desc: "Event log of every action"}
      - {method: POST, path: "/applications/{id}/cancel", roles: "Customer", reusable: false, desc: "Withdraw before an agent accepts"}

  - id: M5
    name: Eligibility, KYC & Rules
    package: eligibility
    owner: Soughat, Shahid
    summary: Aadhaar, PAN, IFSC and bank validation; business-rule configuration and the EMI calculator.
    apis:
      - {method: GET, path: "/config", roles: "Any", reusable: true, owner: Soughat, desc: "Master data - loan purposes, employment types, tenures, rate, radius, min credit score"}
      - {method: PUT, path: "/config", roles: "Manager", reusable: false, owner: Soughat, desc: "Update business rules (versioned, audited)"}
      - {method: GET, path: "/config/emi", roles: "Any", reusable: true, owner: Soughat, desc: "EMI calculator (amount, tenure) - used by apply form and agent view"}
      - {method: POST, path: "/kyc/aadhaar/validate", roles: "Customer", reusable: true, owner: Shahid, desc: "Format + Verhoeff checksum; optional OTP e-KYC via provider"}
      - {method: POST, path: "/kyc/pan/validate", roles: "Customer", reusable: true, owner: Shahid, desc: "Format + PAN status/name match via provider"}
      - {method: GET, path: "/kyc/ifsc/{ifsc}", roles: "Any", reusable: true, owner: Shahid, desc: "Bank and branch lookup (cached in Redis)"}
      - {method: POST, path: "/kyc/bank/verify", roles: "Customer, Manager", reusable: true, owner: Shahid, desc: "Penny-drop account verification and holder-name match"}

  - id: M6
    name: Agent Management
    package: agents
    owner: Manar
    summary: Manager CRUD for agents including GeoJSON location; geo search of nearby agents.
    apis:
      - {method: POST, path: "/agents", roles: "Manager", reusable: false, desc: "Create agent with location (lat/lng), area and credentials"}
      - {method: GET, path: "/agents", roles: "Manager", reusable: false, desc: "List / search / filter (active, area)"}
      - {method: GET, path: "/agents/{id}", roles: "Manager", reusable: false, desc: "Agent details"}
      - {method: PATCH, path: "/agents/{id}", roles: "Manager", reusable: false, desc: "Edit agent incl. location"}
      - {method: PATCH, path: "/agents/{id}/status", roles: "Manager", reusable: false, desc: "Activate / deactivate; releases unfinished cases to the open pool"}
      - {method: DELETE, path: "/agents/{id}", roles: "Manager", reusable: false, desc: "Soft delete (blocked if applications exist)"}
      - {method: GET, path: "/agents/{id}/applications", roles: "Manager", reusable: false, desc: "Customers / applications handled by the agent"}
      - {method: GET, path: "/agents/{id}/performance", roles: "Manager", reusable: false, desc: "Processed, recommendation rate, manager agreement"}
      - {method: GET, path: "/agents/nearby", roles: "Customer, Manager", reusable: true, desc: "Active agents within radius of lat/lng (2dsphere)"}

  - id: M7
    name: Agent Assignments
    package: assignments
    owner: Manar
    summary: Area request pool within the agent radius, atomic first-to-accept, decline.
    apis:
      - {method: GET, path: "/agent/open-requests", roles: "Agent", reusable: false, desc: "Open requests within 2 km of the agent, excluding declined"}
      - {method: POST, path: "/applications/{id}/accept", roles: "Agent", reusable: false, desc: "Atomic claim - first agent wins (findOneAndUpdate)"}
      - {method: POST, path: "/applications/{id}/decline", roles: "Agent", reusable: false, desc: "Hide request for this agent (optional reason)"}

  - id: M8
    name: Agent Verification & Review
    package: reviews
    owner: Manar
    summary: Field/document checks, credit check, comments, recommend or reject.
    apis:
      - {method: POST, path: "/applications/{id}/verification/start", roles: "Agent", reusable: false, desc: "Move to in-verification"}
      - {method: PATCH, path: "/applications/{id}/verification/checks", roles: "Agent", reusable: false, desc: "Tick field and document checks"}
      - {method: POST, path: "/applications/{id}/credit-check", roles: "Agent", reusable: false, desc: "Credit bureau pull once (async); stores score"}
      - {method: POST, path: "/applications/{id}/comments", roles: "Agent", reusable: false, desc: "Add verification comment"}
      - {method: GET, path: "/applications/{id}/comments", roles: "Agent, Manager", reusable: true, desc: "List verification comments"}
      - {method: POST, path: "/applications/{id}/recommend", roles: "Agent", reusable: false, desc: "Recommend to manager (credit >= 650 and all checks done)"}
      - {method: POST, path: "/applications/{id}/agent-reject", roles: "Agent", reusable: false, desc: "Reject with mandatory reason"}

  - id: M9
    name: Manager Decisions & Disbursement
    package: managers
    owner: Shabazz
    summary: Final approval/rejection and payout to the verified bank account.
    apis:
      - {method: POST, path: "/applications/{id}/approve", roles: "Manager", reusable: false, desc: "Final approval (only after agent recommendation and credit >= 650)"}
      - {method: POST, path: "/applications/{id}/reject", roles: "Manager", reusable: false, desc: "Final rejection with mandatory reason"}
      - {method: POST, path: "/applications/{id}/disburse", roles: "Manager", reusable: false, desc: "Payout via IMPS/NEFT/RTGS; Idempotency-Key; returns UTR"}
      - {method: GET, path: "/disbursements", roles: "Manager", reusable: false, desc: "List payouts with status and filters"}
      - {method: GET, path: "/disbursements/{id}", roles: "Customer, Manager", reusable: true, desc: "Disbursement receipt"}
      - {method: POST, path: "/webhooks/payouts", roles: "Provider", reusable: false, desc: "HMAC-signed payout status callback (UTR, success/failure)"}

  - id: M10
    name: Documents
    package: documents
    owner: Shahid
    summary: Direct-to-S3 uploads with presigned URLs, metadata, virus scan, secure download.
    apis:
      - {method: POST, path: "/documents/upload-url", roles: "Customer", reusable: true, desc: "Presigned PUT URL (type, size and MIME validated)"}
      - {method: POST, path: "/documents", roles: "Customer", reusable: true, desc: "Confirm upload and save metadata; queues virus scan"}
      - {method: GET, path: "/applications/{id}/documents", roles: "Customer, Agent, Manager", reusable: true, desc: "List documents of an application"}
      - {method: GET, path: "/documents/{id}/download-url", roles: "Customer, Agent, Manager", reusable: true, desc: "Short-lived presigned GET URL"}
      - {method: DELETE, path: "/documents/{id}", roles: "Customer", reusable: false, desc: "Remove a document before submission"}

  - id: M11
    name: Notifications
    package: notifications
    owner: Shahid
    summary: In-app inbox; SMS/e-mail/push are sent by background workers on domain events.
    apis:
      - {method: GET, path: "/notifications", roles: "Any", reusable: true, desc: "Paginated notification inbox"}
      - {method: GET, path: "/notifications/unread-count", roles: "Any", reusable: true, desc: "Badge count for the bell icon"}
      - {method: PATCH, path: "/notifications/{id}/read", roles: "Any", reusable: true, desc: "Mark one as read"}
      - {method: PATCH, path: "/notifications/read-all", roles: "Any", reusable: true, desc: "Mark all as read"}

  - id: M12
    name: Audit Trail
    package: audit
    owner: Soughat
    summary: Append-only audit log and application events written on every state change; audit search.
    apis:
      - {method: GET, path: "/audit-logs", roles: "Manager", reusable: false, desc: "Search audit trail by entity, actor and date range"}

  - id: M13
    name: Dashboards & Analytics
    package: analytics
    owner: Shabazz
    summary: Role dashboards (aggregation pipelines, Redis cached), charts and exports.
    apis:
      - {method: GET, path: "/dashboard/customer", roles: "Customer", reusable: false, desc: "Customer stat cards and latest application"}
      - {method: GET, path: "/dashboard/agent", roles: "Agent", reusable: false, desc: "Agent stat cards and to-do list"}
      - {method: GET, path: "/dashboard/manager", roles: "Manager", reusable: false, desc: "Manager stat cards and action alerts"}
      - {method: GET, path: "/reports/applications/monthly", roles: "Manager", reusable: false, desc: "Monthly applications chart"}
      - {method: GET, path: "/reports/applications/outcomes", roles: "Manager", reusable: false, desc: "Approved vs rejected vs in-progress"}
      - {method: GET, path: "/reports/agents/performance", roles: "Manager", reusable: false, desc: "Agent performance chart"}
      - {method: GET, path: "/reports/export", roles: "Manager", reusable: false, desc: "CSV/XLSX export (async job, download link)"}

  - id: M14
    name: Support & Health
    package: support
    owner: Soughat
    summary: Liveness/readiness probes; home for customer help and support tickets.
    apis:
      - {method: GET, path: "/health", roles: "Public", reusable: true, desc: "Liveness probe for Docker / load balancer"}
      - {method: GET, path: "/health/ready", roles: "Internal", reusable: true, desc: "Readiness - checks MongoDB, Redis and object storage"}
